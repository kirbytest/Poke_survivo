function onKey(c){

 if(!S){

  else if(c==='ArrowRight'||c==='KeyD'){selIdx=(selIdx+1)%n;showSelect()}
  else if(go)tryStart(selIdx);

  else{const m=c.match(/(Digit|Numpad)([1-4])/);if(m&&+m[2]<=n){selIdx=+m[2]-1;tryStart(selIdx)}}
  return}
 if(S.mode==='over'||S.mode==='win'||S.mode==='quit'){if(S.mode==='win'&&c==='KeyC'){continueDark();return}if(go){S=null;showSelect()}return} /* V0.61 : C = Continuer… ? */ /* V0.59 : + partie abandonnée */

 if(S.mode==='pause'){ /* V0.59 : menu pause */
  if(S.pauseConfirm){if(go||c==='KeyX')pauseAction('oui');else if(c==='Escape')pauseAction('non');return}
  if(S.pauseMap){if(go||c==='Escape'||c==='KeyM'||c==='KeyP'){S.pauseMap=false;showPause()}return} /* V0.64 : carte */
  if(c==='ArrowUp'||c==='KeyW'||c==='KeyZ'){S.pauseSel=((S.pauseSel||0)+3)%4;showPause()}
  else if(c==='ArrowDown'||c==='KeyS'){S.pauseSel=((S.pauseSel||0)+1)%4;showPause()}
  else if(c==='KeyM')pauseAction('carte');
  else if(c==='KeyG')pauseAction('glitch') /* V0.62 */;
  else if(go)pauseAction(['reprendre','carte','glitch','quitter'][S.pauseSel||0]);
  else if(c==='KeyP'||c==='Escape')pauseAction('reprendre');
  else if(c==='KeyX')pauseAction('quitter');
  return}
 if(S.mode==='levelup'){
  const n=S.choices.length;

  else if(go)pick(S.sel);
  else{const m=c.match(/(Digit|Numpad)([1-3])/);if(m&&+m[2]<=n)pick(+m[2]-1)}}
}

 const old=p.maxHp;p.maxHp=B.hp+20*(P.pv||0)+(ev?30:0)+(st3?80:0);if(p.maxHp>old)p.hp+=p.maxHp-old;
 p.dmg=B.dmg*(1+0.12*(P.puissance||0))*(ev?1.2:1)*(st3?1.35:1);
 p.cd=1-0.08*(P.agilite||0);
 p.magnet=70*(1+0.35*(P.aimant||0))*(st3?1.2:1);
 p.regen=B.regen+0.4*(P.regen||0)+(st3?0.5:0);
 p.r=st3?25:ev?21:17}

  if(S.w[f.from]===MAXL&&!S.evo[f.from]&&ok)r.push({k:'evo',id,from:f.from,l:0,d:f})}return r}
function needLabel(f){return f.needW?WEAPONS[f.needW].ic+' '+WEAPONS[f.needW].nm+(f.lvl?' (niv. '+f.lvl+')':''):PASSIVES[f.need].ic+' '+PASSIVES[f.need].nm}
function needName(f){return f.needW?WEAPONS[f.needW].nm:PASSIVES[f.need].nm}

  const l=S.w[id]||0;if(l<MAXL&&(l>0||nW<4)){

  pool.push({k:'w',id,l,d:Object.assign({},WEAPONS[id],{ds:WEAPONS[id].ds+(f?`<br><small>🌀 Fusion niv.5 + ${needLabel(f)}${(!f.needW&&!S.pas[f.need]&&nP>=PASSIFS_MAX)?' <b style=color:#c62828>(passif absent, plus de place)</b>':''}</small>`:'')})})}}
 for(const id in PASSIVES){const l=S.pas[id]||0;if(l<pmax(id)&&(l>0||nP<PASSIFS_MAX))pool.push({k:'p',id,l,d:Object.assign({},PASSIVES[id],{ds:PASSIVES[id].ds+pasFusionNote(id)})}) /* V0.64 : 4 passifs max */}
 for(let i=pool.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[pool[i],pool[j]]=[pool[j],pool[i]]}

function hurt(e,d){
 if(e.dead)return;
 if(e.invul){if(!e.qT||e.qT<S.t){e.qT=S.t+0.3;S.nums.push({x:e.x+rand(-12,12),y:e.y-e.r,v:'???',life:0.8,c:'#d0d0d0',big:1})}return} /* V0.61 : MissingNo. est invincible */

 if(e.parUntil>S.t)d*=PARALYSIE_BONUS; /* V0.62 */
 {const real=Math.max(0,Math.min(d,e.hp)),R=S.dmgS[SRC]||(S.dmgS[SRC]={d:0,k:0});R.d+=real;if(e.hp-d<=0)R.k++} /* V0.64 : répartition des dégâts */
 e.hp-=d;e.flash=0.1;

 if(e.hp<=0){
  e.dead=true;S.kills++;
  S.gems.push({x:e.x,y:e.y,v:e.xp});
  if(e.boss){for(let i=0;i<12;i++)S.gems.push({x:e.x+rand(-70,70),y:e.y+rand(-70,70),v:5});
   S.gems.push({x:e.x+20,y:e.y,v:30});S.gems.push({x:e.x-20,y:e.y,heal:60});banner(e.nm+' est K.O. ! Ramasse le Super Bonbon !')}
  else if(Math.random()<(e.heavy?AIMANT_CHANCE_ELITE:AIMANT_CHANCE_NORMAL)){S.gems.push({x:e.x,y:e.y,aimant:1});banner('🧲 Un Aimant à XP est tombé !')} /* V0.60 */
  else if(Math.random()<(e.heavy?HYPER_CHANCE_ELITE:HYPER_CHANCE_NORMAL)){S.gems.push({x:e.x,y:e.y,heal:1,hyper:1});banner('🌈 Une Hyper Potion est tombée !')} /* V0.58 */
  else if(Math.random()<(e.heavy?0.35:0.012))S.gems.push({x:e.x,y:e.y,heal:25});
  if(S.st==='pikachu'&&S.p.stage<1&&!S.pierreDrop&&(e.boss||(e.heavy&&Math.random()<PIERRE_FOUDRE_CHANCE_ELITE))){S.gems.push({x:e.x,y:e.y+26,foudre:1});S.pierreDrop=true;banner('⚡ Une Pierre Foudre est tombée !')} /* V0.62 */

 }

}
function cdReady(id,base){S.timers[id]=(S.timers[id]===undefined?0:S.timers[id])-DT; /* V0.4 compat */if(S.timers[id]<=0){S.timers[id]=base*S.p.cd*(id===STARTERS[S.st].w?SIG_CD:1);return true}return false}
function nearest(n){const p=S.p;return S.enemies.filter(e=>!e.dead).map(e=>[e,(e.x-p.x)**2+(e.y-p.y)**2]).sort((a,b)=>a[1]-b[1]).slice(0,n).map(a=>a[0])}

function updateWeapons(){

 /* V0.62 : tirs différés (salves Multi-Coups, étincelles de Vive-Attaque, anneaux de Cage-Éclair) */

   for(let i=0;i<1+MC;i++){const t=tg[i];if(!t&&i>0)break;const a=t?Math.atan2(t.y-p.y,t.x-p.x):Math.atan2(p.dy,p.dx);
    S.beams.push({x:p.x,y:p.y,a,len,w:30,life:0.3,col:'255,236,150'});beamHit(p.x,p.y,a,len,30,140*D)}}}
 /* Écume / Surf — V0.62 : Surf remplace Écume, +1 vague par niveau de Multi-Coups */

  if(E&&cdReady('surf',SURF_RECHARGE)){const tg0=nearest(1)[0],a0=tg0?Math.atan2(tg0.y-p.y,tg0.x-p.x):Math.atan2(p.dy,p.dx),n=1+MC;

    if(i===0)mk();else S.later.push({src:SRC,t:0.1*i,f:mk})}}}

function tipImg(code){
 if(TIPIMG[code]!==undefined)return TIPIMG[code];
 const[k,v]=code.split(/:(.*)/);let url=null;
 try{
  if(k==='e'&&DRAW_E[v])url=canvasOf(110,g=>{const r=v==='ronflex'?24:v==='mewtwo'?26:30;DRAW_E[v](g,r)}).toDataURL();

  else if(k==='p3'&&DRAW_P3[v])url=canvasOf(110,g=>{g.translate(4,10);DRAW_P3[v](g,26,true,0.4)}).toDataURL();
 }catch(err){url=null}
 return TIPIMG[code]=url}

 if(!PORTRAITS.pikachu_lock)PORTRAITS.pikachu_lock=canvasOf(150,g=>{g.translate(0,10);DRAW_P.pikachu(g,36,false,0.4);g.setTransform(1,0,0,1,0,0);g.globalCompositeOperation='source-atop';g.fillStyle='#1c1c2e';g.fillRect(0,0,150,150)}).toDataURL(); /* V0.62 : silhouette */
 const gemImg=k=>gemSprite(k).toDataURL();
 ov.classList.remove('hidden');
 ov.innerHTML=`<div class="wrap"><h1>⚡ POKÉ SURVIVOR ⚡<span class="ver">${VERSION}</span></h1><p style="font-size:13px;color:#ffe9a8;margin:0 0 4px">${VERSION} – mise à jour le ${MAJ_DATE}</p><p style="color:#ccc">Choisis ton starter de <b>Kanto</b> et survis <b>8 minutes</b>, puis bats <b>Mewtwo</b> !</p>${recLine()}<p id="lockmsg" style="color:#ffd54f;font-weight:bold;margin:2px 0"></p>
 <div class="cards">`+STARTER_IDS.map((id,i)=>{const s=STARTERS[id],w=WEAPONS[s.w];if(s.secret&&!pikaOk())return lockedCard(i);return `<div class="card ${i===selIdx?'sel':''}" data-i="${i}">
  <img src="${PORTRAITS[id]}"><div class="nm">${s.nm}</div><span class="ty" style="background:${s.col}">${s.ty}</span>
  <div class="ds">${s.ds}</div><div class="st">❤️ ${s.hp} PV • 💨 ${s.sp} • ⚔️ ×${s.dmg.toFixed(2)}</div>
  <div class="st">Attaque de départ : <b>${w.ic} ${w.nm}</b> (dégâts ×2, recharge −30 %)</div><div class="atk">4 attaques : ${ALLOWED[id].map(k=>WEAPONS[k].ic+' '+WEAPONS[k].nm).join(' • ')}<br>${s.secret?'Évolue en <b>Raichu</b> avec la <b>Pierre Foudre</b> (lâchée par le 1er boss), sinon au niv. '+NIVEAU_EVO_FINALE:`Évolue en <b>${s.evo}</b> (niv. 15) puis <b>${s.evo2}</b> (niv. ${NIVEAU_EVO_FINALE})`}</div><div class="evos"><img src="${PORTRAITS[id+'_1']}" title="${s.evo}"><img src="${PORTRAITS[id+'_2']}" title="${s.evo2}"></div><div class="key">${i+1}</div></div>`}).join('')+`</div>
 <div class="row">${cmdsBox()} <div id="tipzone"></div> ${lastBox()}</div>
 <p style="margin-top:10px"><button class="tipbtn" id="glxBtn">👾 Effets glitch : ${GLX.reduit?'réduits':'normaux'} (G)</button></p>
 <p class="blink" style="margin-top:14px;font-size:20px">← → pour choisir, <b>Entrée</b> pour commencer • <b>A</b> / <b>E</b> : astuces</p></div>`;
 if(TOUCH){const bl=ov.querySelector('.blink');if(bl)bl.innerHTML='Touche un starter pour commencer'} /* V0.60 */ /* V0.58 : carrousel à la place des blocs Objets / Fusions / Dangers */
 afficherAstuces(document.getElementById('tipzone'));
 {const hb=document.getElementById('histBtn');if(hb)hb.addEventListener(TAP,ev=>{ev.stopPropagation();ev.preventDefault();MENU.sel=0;MENU.conf=false;showHist()})} /* V0.64 */
 {const gb=document.getElementById('glxBtn');if(gb)gb.addEventListener(TAP,ev=>{ev.stopPropagation();ev.preventDefault();toggleGlitch();showSelect()})} /* V0.62 */
 ov.querySelectorAll('.card').forEach(el=>el.addEventListener(TAP,e=>{e.stopPropagation();selIdx=+el.dataset.i;tryStart(selIdx)}))}
ov.addEventListener(TAP,()=>{if(S&&(S.mode==='over'||S.mode==='quit')){S=null;showSelect()}}); /* V0.61 : en victoire, on passe par les boutons */

/* ===== V0.60 : boutons tactiles en jeu ===== */
document.getElementById('bPause').addEventListener(TAP,ev=>{ev.stopPropagation();ev.preventDefault();if(S&&S.mode==='play'){S.mode='pause';S.pauseSel=0;S.pauseConfirm=false;joy=null;showPause()}});
document.getElementById('bMap').addEventListener(TAP,ev=>{ev.stopPropagation();ev.preventDefault();showMap=!showMap}); /* V0.64 */
document.getElementById('bLeg').addEventListener(TAP,ev=>{ev.stopPropagation();ev.preventDefault();showLegend=!showLegend});
['pointerdown','pointerup','touchstart'].forEach(t=>document.getElementById('tbtns').addEventListener(t,ev=>ev.stopPropagation(),{passive:true}));
/* icône d'écran d'accueil générée en code (Salamèche) */
try{const ic=canvasOf(180,g=>{const gr=g.createRadialGradient(0,-20,10,0,0,130);gr.addColorStop(0,'#9fd8ff');gr.addColorStop(1,'#2a5bd7');g.fillStyle=gr;g.fillRect(-90,-90,180,180);g.translate(4,6);DRAW_P.salameche(g,52,false,0.4)}).toDataURL('image/png');
 for(const r of['apple-touch-icon','icon']){const l=document.createElement('link');l.rel=r;l.href=ic;document.head.appendChild(l)}}catch(err){}
let last=performance.now();
/* V0.4 : boucle protégée — une erreur n'arrête plus le jeu et s'affiche à l'écran */
let LASTERR=null;
function showErr(m){LASTERR={m:String(m).slice(0,160),t:6}}
addEventListener('error',e=>showErr(e.message));
function loop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;
 document.body.classList.toggle('playing',!!(S&&S.mode==='play')); /* V0.60 : affiche les boutons tactiles en jeu */
 try{if(S&&S.mode==='play')update(dt)}catch(err){showErr('update: '+err.message)}
 try{render()}catch(err){showErr('render: '+err.message)}
 try{tipTick(dt)}catch(err){showErr('astuces: '+err.message)} /* V0.58 */
 try{if(S&&S.mode==='play'&&S.pendingLv>0&&!S.evoAnim)openLevelUp()}catch(err){showErr('levelup: '+err.message)}
 if(LASTERR){LASTERR.t-=dt;ctx.fillStyle='rgba(180,0,0,.9)';ctx.fillRect(10,H/2-20,W-20,40);ctx.fillStyle='#fff';ctx.font='bold 14px Arial';ctx.textAlign='left';
  ctx.fillText('Erreur '+VERSION+' (fais une capture) : '+LASTERR.m,20,H/2+5);if(LASTERR.t<=0)LASTERR=null}
 requestAnimationFrame(loop)}
/* V0.2 : données du jeu figées (non modifiables pendant la partie) */
for(const o of[STARTERS,WEAPONS,PASSIVES,GEMS,ETYPES,EVOS]){Object.values(o).forEach(Object.freeze);Object.freeze(o)}
Object.freeze(TIP_CATS);Object.freeze(CHETI_INTROS);Object.freeze(CHETI_MOOD);TIPS.forEach(Object.freeze);Object.freeze(TIPS);Object.freeze(DRAW_P);Object.freeze(DRAW_P3);Object.freeze(DRAW_E);Object.freeze(BOSS_PLAN);Object.values(ALLOWED).forEach(Object.freeze);Object.freeze(ALLOWED);
showSelect();requestAnimationFrame(loop);
})();
